name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend/frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend/frontend
        run: npm run build

  maven-package:
    name: Maven package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package reactor
        run: mvn -B -ntp -DskipTests package

  compose-config:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seed .env from example
        run: cp .env.example .env

      - name: Validate production compose file
        run: docker compose -f docker-compose.prod.yml config --quiet

  docker-build:
    name: Docker build - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: service-registry
            module: infra/service-registry
          - name: api-gateway
            module: infra/api-gateway
          - name: flight-search-service
            module: services/flight-search-service
          - name: booking-service
            module: services/booking-service
          - name: user-service
            module: services/user-service
          - name: payment-service
            module: services/payment-service
          - name: notification-service
            module: services/notification-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: abs/${{ matrix.name }}:ci
          build-args: |
            MODULE=${{ matrix.module }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  frontend-docker-build:
    name: Docker build - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend/frontend
          file: frontend/frontend/Dockerfile
          push: false
          tags: abs/frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
