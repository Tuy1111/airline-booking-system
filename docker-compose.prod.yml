# ==============================================================================
# Full-stack deploy cho VPS: core infra + backend services + frontend.
# Build & chạy tất cả trên VPS:
#     cp .env.example .env      # điền secrets (JWT, SEPAY...) 1 lần
#     docker compose -f docker-compose.prod.yml up -d --build
#
# Điểm mấu chốt: source hardcode "localhost" cho DB/Redis/Eureka -> ở đây override
# bằng biến môi trường (Spring relaxed-binding) trỏ sang tên container. KHÔNG sửa source.
#
# Monitoring (Zipkin/Prometheus/Grafana) là optional, bật bằng:
#     docker compose -f docker-compose.prod.yml --profile monitoring up -d --build
# ==============================================================================

x-eureka: &eureka
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
  EUREKA_INSTANCE_PREFERIPADDRESS: "true"

x-observability: &observability
  TRACING_ENABLED: "${TRACING_ENABLED:-false}"
  ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans

# Mọi app dùng chung base build (Dockerfile ở root, chọn module qua build arg MODULE)
x-app-build: &app-build
  restart: unless-stopped
  networks: [abs]

services:

  # ------------------------------------------------------------------ INFRA ---
  postgres:
    image: postgres:16
    container_name: abs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-abs}
      POSTGRES_PASSWORD: ${DB_PASS:-abs123}
      POSTGRES_DB: postgres
    # Host 5555 -> container 5432 (tránh đụng Postgres native/cổng khác trên VPS).
    # Nội bộ Docker các service vẫn nối qua postgres:5432, KHÔNG đổi.
    ports: ["5555:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Tạo 5 DB lần đầu. Dùng .sql (không phải .sh) để tránh lỗi CRLF trên Windows checkout.
      - ./infra/docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-abs}"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [abs]

  redis:
    image: redis:7-alpine
    container_name: abs-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    # Internal only. Do not publish Redis on the VPS host.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [abs]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: abs-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [abs]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: abs-kafka
    restart: unless-stopped
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # In-network dùng kafka:29092, host dùng localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks: [abs]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: abs-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [abs]

  mailhog:
    image: mailhog/mailhog:latest
    container_name: abs-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [abs]

  # -------------------------------------------------------------------- APPS ---
  frontend:
    restart: unless-stopped
    container_name: abs-frontend
    build:
      context: ./frontend/frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api-gateway:
        condition: service_started
      flight-search-service:
        condition: service_started
      booking-service:
        condition: service_started
      user-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [abs]

  service-registry:
    <<: *app-build
    container_name: abs-service-registry
    build:
      context: .
      args:
        MODULE: infra/service-registry
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  api-gateway:
    <<: *app-build
    container_name: abs-api-gateway
    build:
      context: .
      args:
        MODULE: infra/api-gateway
    environment:
      <<: [*eureka, *observability]
    ports: ["8080:8080"]
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  flight-search-service:
    <<: *app-build
    container_name: abs-flight-search
    build:
      context: .
      args:
        MODULE: services/flight-search-service
    environment:
      <<: [*eureka, *observability]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flight_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-abs}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS:-abs123}
    ports: ["8081:8081"]
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  booking-service:
    <<: *app-build
    container_name: abs-booking
    build:
      context: .
      args:
        MODULE: services/booking-service
    environment:
      <<: [*eureka, *observability]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking_db?options=-c%20timezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-abs}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS:-abs123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP: kafka:29092
      # booking gọi trực tiếp sang service khác -> trỏ vào tên container (không phải localhost)
      APP_SERVICES_USER_URL: http://user-service:8083
      APP_SERVICES_FLIGHT_SEARCH_URL: http://flight-search-service:8081
    ports: ["8082:8082"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  user-service:
    <<: *app-build
    container_name: abs-user
    build:
      context: .
      args:
        MODULE: services/user-service
    environment:
      <<: [*eureka, *observability]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-abs}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS:-abs123}
      JWT_SECRET: ${JWT_SECRET:-dev-only-user-service-jwt-secret-change-me-0123456789abcdef}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
    ports: ["8083:8083"]
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  payment-service:
    <<: *app-build
    container_name: abs-payment
    build:
      context: .
      args:
        MODULE: services/payment-service
    environment:
      <<: [*eureka, *observability]
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-abs}
      DB_PASS: ${DB_PASS:-abs123}
      KAFKA_BOOTSTRAP: kafka:29092
      SEPAY_API_KEY: ${SEPAY_API_KEY:-}
      SEPAY_BANK_ACC: ${SEPAY_BANK_ACC:-}
      SEPAY_BANK_CODE: ${SEPAY_BANK_CODE:-}
      SEPAY_ACC_HOLDER: ${SEPAY_ACC_HOLDER:-}
      SEPAY_QR_BASE: ${SEPAY_QR_BASE:-https://qr.sepay.vn/img}
      SEPAY_QR_TEMPLATE: ${SEPAY_QR_TEMPLATE:-compact}
      SEPAY_EXPIRES_MIN: ${SEPAY_EXPIRES_MIN:-15}
    ports: ["8084:8084"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  notification-service:
    <<: *app-build
    container_name: abs-notification
    build:
      context: .
      args:
        MODULE: services/notification-service
    environment:
      <<: [*eureka, *observability]
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-abs}
      DB_PASS: ${DB_PASS:-abs123}
      KAFKA_BOOTSTRAP: kafka:29092
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      MAIL_FROM: ${MAIL_FROM:-no-reply@airline.local}
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: "5672"
      RABBIT_USER: ${RABBIT_USER:-guest}
      RABBIT_PASS: ${RABBIT_PASS:-guest}
    ports: ["8085:8085"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      service-registry:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ------------------------------------------------ MONITORING (optional) ------
  zipkin:
    image: openzipkin/zipkin:3
    container_name: abs-zipkin
    restart: unless-stopped
    profiles: ["monitoring"]
    ports: ["9411:9411"]
    networks: [abs]

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: abs-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    ports: ["9090:9090"]
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [abs]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: abs-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - grafanadata:/var/lib/grafana
    networks: [abs]
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: abs-keycloak
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5555/keycloak
      KC_DB_USERNAME: abs
      KC_DB_PASSWORD: abs123
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
    command: start-dev --import-realm
    ports:
      - "8180:8180"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
networks:
  abs:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  grafanadata:
