# ==============================================================================
# Full-stack deploy cho VPS: core infra + backend services + frontend.
# Build & chạy tất cả trên VPS:
#     cp .env.example .env      # điền secrets (JWT, SEPAY...) 1 lần
#     docker compose -f docker-compose.prod.yml up -d --build
#
# Điểm mấu chốt: source hardcode "localhost" cho DB/Redis/Eureka -> ở đây override
# bằng biến môi trường (Spring relaxed-binding) trỏ sang tên container. KHÔNG sửa source.
#
# Monitoring (Zipkin/Prometheus/Grafana) là optional, bật bằng:
#     docker compose -f docker-compose.prod.yml --profile monitoring up -d --build
# ==============================================================================

x-eureka: &eureka
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
  EUREKA_INSTANCE_PREFERIPADDRESS: "true"

x-observability: &observability
  TRACING_ENABLED: "${TRACING_ENABLED:-false}"
  ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans

# Mọi app dùng chung base build (Dockerfile ở root, chọn module qua build arg MODULE)
x-app-build: &app-build
  restart: unless-stopped
  networks: [abs]

services:

  # ------------------------------------------------------------- EDGE / TLS ---
  # The only public entry point. Caddy obtains and renews Let's Encrypt
  # certificates for app.<DOMAIN> and auth.<DOMAIN> automatically.
  caddy:
    image: caddy:2.8-alpine
    container_name: abs-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN chua set trong .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL chua set trong .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      frontend:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [abs]

  # ------------------------------------------------------------------ INFRA ---
  postgres:
    image: postgres:16
    container_name: abs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER chua set trong .env}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS chua set trong .env}
      POSTGRES_DB: postgres
    # Host 5555 -> container 5432 (tránh đụng Postgres native/cổng khác trên VPS).
    # Nội bộ Docker các service vẫn nối qua postgres:5432, KHÔNG đổi.
    ports: ["5555:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Tạo 5 DB lần đầu. Dùng .sql (không phải .sh) để tránh lỗi CRLF trên Windows checkout.
      - ./infra/docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER chua set trong .env}"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [abs]

  redis:
    image: redis:7-alpine
    container_name: abs-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    # Internal only. Do not publish Redis on the VPS host.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [abs]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: abs-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [abs]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: abs-kafka
    restart: unless-stopped
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # In-network dùng kafka:29092, client ngoài dùng <KAFKA_ADVERTISED_HOST>:9092.
      # Tren VPS phai set KAFKA_ADVERTISED_HOST=<IP VPS> trong .env, neu khong
      # client ngoai se nhan ve "localhost:9092" va connect vao chinh may no.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks: [abs]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: abs-rabbitmq
    restart: unless-stopped
    environment:
      # Tao dung user ma notification-service dung de connect (RABBIT_USER/RABBIT_PASS).
      # Khong set thi container chi co guest/guest -> doi RABBIT_USER se fail connect.
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:?RABBIT_USER chua set trong .env}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:?RABBIT_PASS chua set trong .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [abs]

  mailhog:
    image: mailhog/mailhog:latest
    container_name: abs-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [abs]

  # -------------------------------------------------------------------- APPS ---
  frontend:
    restart: unless-stopped
    container_name: abs-frontend
    build:
      context: ./frontend/frontend
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:?VITE_KEYCLOAK_URL chua set trong .env}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-airline-booking}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-airline-frontend}
    expose: ["80"]
    depends_on:
      api-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [abs]

  service-registry:
    <<: *app-build
    container_name: abs-service-registry
    build:
      context: .
      args:
        MODULE: infra/service-registry
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  api-gateway:
    <<: *app-build
    container_name: abs-api-gateway
    build:
      context: .
      args:
        MODULE: infra/api-gateway
    environment:
      <<: [*eureka, *observability]
      # RequestRateLimiter cua gateway can Redis (khong co -> route booking loi 500)
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8180}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8180
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS chua set trong .env}
    ports: ["8080:8080"]
    depends_on:
      redis:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  flight-search-service:
    <<: *app-build
    container_name: abs-flight-search
    build:
      context: .
      args:
        MODULE: services/flight-search-service
    environment:
      <<: [*eureka, *observability]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flight_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?DB_USER chua set trong .env}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS:?DB_PASS chua set trong .env}
    expose: ["8081"]
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  booking-service:
    <<: *app-build
    container_name: abs-booking
    build:
      context: .
      args:
        MODULE: services/booking-service
    environment:
      <<: [*eureka, *observability]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking_db?options=-c%20timezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?DB_USER chua set trong .env}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS:?DB_PASS chua set trong .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP: kafka:29092
      # KHONG hardcode URL service khac o day: booking goi qua Eureka bang TEN SERVICE
      # (Feign @FeignClient(name=...) va RestTemplate @LoadBalanced) -> tu resolve instance.
    expose: ["8082"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  user-service:
    <<: *app-build
    container_name: abs-user
    build:
      context: .
      args:
        MODULE: services/user-service
    environment:
      <<: [*eureka, *observability]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?DB_USER chua set trong .env}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS:?DB_PASS chua set trong .env}
    expose: ["8083"]
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  payment-service:
    <<: *app-build
    container_name: abs-payment
    build:
      context: .
      args:
        MODULE: services/payment-service
    environment:
      <<: [*eureka, *observability]
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:?DB_USER chua set trong .env}
      DB_PASS: ${DB_PASS:?DB_PASS chua set trong .env}
      KAFKA_BOOTSTRAP: kafka:29092
      # Dung "?" (khong phai ":?"): bao loi khi THIEU key, nhung cho phep de RONG.
      # Dev khong co tai khoan SePay -> de rong, app van boot (chi SePay khong xai duoc).
      SEPAY_API_KEY: ${SEPAY_API_KEY?SEPAY_API_KEY chua co trong .env}
      SEPAY_BANK_ACC: ${SEPAY_BANK_ACC?SEPAY_BANK_ACC chua co trong .env}
      SEPAY_BANK_CODE: ${SEPAY_BANK_CODE?SEPAY_BANK_CODE chua co trong .env}
      SEPAY_ACC_HOLDER: ${SEPAY_ACC_HOLDER?SEPAY_ACC_HOLDER chua co trong .env}
      SEPAY_QR_BASE: ${SEPAY_QR_BASE:?SEPAY_QR_BASE chua set trong .env}
      SEPAY_QR_TEMPLATE: ${SEPAY_QR_TEMPLATE:?SEPAY_QR_TEMPLATE chua set trong .env}
      SEPAY_EXPIRES_MIN: ${SEPAY_EXPIRES_MIN:?SEPAY_EXPIRES_MIN chua set trong .env}
    expose: ["8084"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  notification-service:
    <<: *app-build
    container_name: abs-notification
    build:
      context: .
      args:
        MODULE: services/notification-service
    environment:
      <<: [*eureka, *observability]
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:?DB_USER chua set trong .env}
      DB_PASS: ${DB_PASS:?DB_PASS chua set trong .env}
      KAFKA_BOOTSTRAP: kafka:29092
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM chua set trong .env}
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: "5672"
      RABBIT_USER: ${RABBIT_USER:?RABBIT_USER chua set trong .env}
      RABBIT_PASS: ${RABBIT_PASS:?RABBIT_PASS chua set trong .env}
    expose: ["8085"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      service-registry:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ------------------------------------------------ MONITORING (optional) ------
  zipkin:
    image: openzipkin/zipkin:3
    container_name: abs-zipkin
    restart: unless-stopped
    profiles: ["monitoring"]
    ports: ["9411:9411"]
    networks: [abs]

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: abs-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    ports: ["9090:9090"]
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [abs]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: abs-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?GRAFANA_USER chua set trong .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:?GRAFANA_PASS chua set trong .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - grafanadata:/var/lib/grafana
    networks: [abs]

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: abs-keycloak
    restart: unless-stopped
    environment:
      KC_DB: postgres
      # DB keycloak duoc tao san boi infra/docker/init-databases.sql
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER:?DB_USER chua set trong .env}
      KC_DB_PASSWORD: ${DB_PASS:?DB_PASS chua set trong .env}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN chua set trong .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD chua set trong .env}
      KC_HTTP_PORT: 8180
      KC_HOSTNAME: ${KEYCLOAK_URL:?KEYCLOAK_URL chua set trong .env}
      KC_PROXY_HEADERS: xforwarded
    command: start-dev --import-realm
    expose: ["8180"]
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    networks: [abs]
networks:
  abs:
    driver: bridge

volumes:
  caddydata:
  caddyconfig:
  pgdata:
  redisdata:
  grafanadata:
