server:
  port: 8082

spring:
  application:
    name: booking-service
  datasource:
    # Cấu hình đọc từ .env ở root repo. Docker override qua SPRING_DATASOURCE_URL -> postgres:5432
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/booking_db?options=-c%20timezone=Asia/Ho_Chi_Minh
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mvc:
    pathmatch:
      base-path: /api/v1
  data:
    redis:
      # Docker override qua SPRING_DATA_REDIS_HOST -> redis
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: booking-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

booking:
  hold:
    ttl-minutes: 10

app:
  kafka:
    topics:
      booking-held: booking.held
      booking-confirmed: booking.confirmed
      booking-cancelled: booking.cancelled
      booking-expired: booking.expired
      payment-completed: payment.completed
      payment-failed: payment.failed
  outbox:
    poll-interval-ms: 2000
    batch-size: 50

management:
  endpoints:
    web:
      exposure:
        include: health, info, flyway, prometheus, metrics
  endpoint:
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
    enabled: ${TRACING_ENABLED}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"

eureka:
  instance:
    # Khong set hostname: prefer-ip-address=true -> Eureka dang ky bang IP
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
