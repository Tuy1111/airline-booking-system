server:
  port: 8085

spring:
  application:
    name: notification-service
  datasource:
    # Cấu hình đọc từ .env ở root repo. Docker set DB_HOST=postgres/DB_PORT=5432.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/notify_db
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # SMTP -> MailHog in dev (no auth)
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  # RabbitMQ command queue (cmd.email.send / cmd.sms.send)
  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASS}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

  # Kafka event consumer (booking.confirmed, booking.cancelled)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

app:
  notification:
    from-address: ${MAIL_FROM}
    rabbit:
      email-queue: cmd.email.send
      sms-queue: cmd.sms.send
    kafka:
      booking-confirmed-topic: booking.confirmed
      booking-cancelled-topic: booking.cancelled

management:
  endpoints:
    web:
      exposure:
        include: health, info, flyway, prometheus, metrics
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
    enabled: ${TRACING_ENABLED}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"

eureka:
  instance:
    # Khong set hostname: prefer-ip-address=true -> Eureka dang ky bang IP
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: ${EUREKA_URL}