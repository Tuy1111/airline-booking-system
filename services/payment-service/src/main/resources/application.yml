server:
  port: 8084

spring:
  application:
    name: payment-service
  datasource:
    # Cấu hình đọc từ .env ở root repo. Docker set DB_HOST=postgres/DB_PORT=5432.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/payment_db
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true

app:
  sepay:
    api-key: ${SEPAY_API_KEY:}
    bank-account: ${SEPAY_BANK_ACC}
    bank-code: ${SEPAY_BANK_CODE}
    account-holder: ${SEPAY_ACC_HOLDER}
    qr-base: ${SEPAY_QR_BASE}
    qr-template: ${SEPAY_QR_TEMPLATE}
    expires-minutes: ${SEPAY_EXPIRES_MIN}
    # HMAC-SHA256 webhook secret. Leave empty only for legacy API-key mode.
    webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
    webhook-timestamp-tolerance-seconds: ${SEPAY_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:300}
  kafka:
    topics:
      payment-completed: payment.completed
      payment-failed:    payment.failed
  outbox:
    poll-interval-ms: 2000
    batch-size: 50
  payment:
    # Quét các payment PENDING quá hạn (expires_at) -> đánh FAILED + publish payment.failed
    expiry-scan-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health, info, flyway, prometheus, metrics
  endpoint:
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
    enabled: ${TRACING_ENABLED}              # bật = true khi đã chạy Zipkin (Docker)
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"

eureka:
  instance:
    # Khong set hostname: prefer-ip-address=true -> Eureka dang ky bang IP
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
