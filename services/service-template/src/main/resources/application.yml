server:
  port: 8090

spring:
  application:
    name: service-template
  # H2 in-memory để template chạy được ngay (mvn spring-boot:run). Lên thật đổi sang
  # Postgres + Flyway (xem payment-service/notification-service) — code domain không đổi.
  datasource:
    url: jdbc:h2:mem:template;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop      # template only; thật → validate + Flyway
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true              # http://localhost:8090/h2-console

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

logging:
  pattern:
    level: "%5p [${spring.application.name}]"
