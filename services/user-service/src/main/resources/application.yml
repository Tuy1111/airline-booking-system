server:
  port: 8083

spring:
  application:
    name: user-service
  datasource:
    # Cấu hình đọc từ .env ở root repo. Docker override qua SPRING_DATASOURCE_URL -> postgres:5432
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/user_db
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mvc:
    pathmatch:
      base-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health, info, flyway, prometheus, metrics
  endpoint:
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
    enabled: ${TRACING_ENABLED}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

security:
  jwt:
    # HS256 secret — MUST be >= 32 bytes. Set JWT_SECRET trong .env, không hardcode.
    secret: ${JWT_SECRET}
    ttl-seconds: ${JWT_TTL_SECONDS}
    issuer: user-service

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME}
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: ${EUREKA_URL}